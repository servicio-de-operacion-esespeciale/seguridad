<div class="tab-container">
    <div class="tabs">
        <div class="tab active" onclick="showTab('enero')">Enero</div>
        <div class="tab" onclick="showTab('febrero')">Febrero</div>
        <div class="tab" onclick="showTab('marzo')">Marzo</div>
        <div class="tab" onclick="showTab('abril')">Abril</div>

    <div id="enero" class="tab-content active">
        <h1>Calculadora Enero 2026</h1>
        <label>Categoría:</label>
        <select id="categoriaEnero" onchange="calcularSueldo('Enero')">
            <option value="vigilador_general">Vigilador General</option>
            <option value="vigilador_bombero">Vigilador Bombero</option>
            <option value="administrativo">Administrativo</option>
            <option value="vigilador_principal">Vigilador Principal</option>
            <option value="verificacion_eventos">Verificación Eventos</option>
            <option value="operador_monitoreo">Operador de Monitoreo</option>
            <option value="guia_tecnico">Guía Técnico</option>
            <option value="instalador_seguridad">Instalador de Seguridad Electrónica</option>
            <option value="control_admision">Control de Admisión y Permanencia</option>
        </select>
        <label>Sueldo Básico:</label> <input id="sueldo_basicoEnero" readonly type="text" />
        <label>Antigüedad (Años):</label> <input id="antiguedadEnero" type="number" oninput="calcularSueldo('Enero')" />
        <label>Presentismo:</label> <input id="presentismoEnero" readonly type="text" />
        <label>Viático:</label> <input id="viaticoEnero" readonly type="text" />
        <label>No Remunerativo:</label> <input id="adicional_no_remunerativoEnero" readonly type="text" />
        <label>Horas Nocturnas:</label> <input id="horas_nocturnasEnero" type="number" oninput="calcularSueldo('Enero')" />
        <label>Horas Feriado:</label> <input id="horas_feriadoEnero" type="number" oninput="calcularSueldo('Enero')" />
        <label>Horas al 50%:</label> <input id="horas_al50Enero" type="number" oninput="calcularSueldo('Enero')" />
        <label>Horas al 100%:</label> <input id="horas_al100Enero" type="number" oninput="calcularSueldo('Enero')" />
        <label>Afiliado Sindicato:</label>
        <select id="sindicatoEnero" onchange="calcularSueldo('Enero')">
            <option value="si">Sí (20%)</option>
            <option value="no">No (17%)</option>
        </select>

        <div class="result-label">Resultados Enero:</div>
        <label>Sueldo Bruto:</label> <input id="sueldo_brutoEnero" readonly type="text" class="result-input" />
        <label>Descuentos:</label> <input id="descuentoEnero" readonly type="text" class="result-input" />
        <label>Sueldo Neto:</label> <input id="sueldo_netoEnero" readonly type="text" class="result-input" />
    </div>
